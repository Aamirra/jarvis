name: Daily YouTube Shorts Upload

on:
  schedule:
    - cron: "0 12 * * *"   # runs daily at 12:00 UTC — change to your preferred time
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gTTS "moviepy==1.0.3" Pillow \
                      google-auth google-auth-oauthlib google-api-python-client

      - name: Generate Video and Upload to YouTube
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: python auto_pipeline.py
