name: Daily Rumble + YouTube Video

on:
  schedule:
    - cron: "0 12 * * *"   # 1 video/day, 12:00 UTC = 5:00 PM Pakistan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --upgrade -r requirements.txt

      - name: Generate video and upload to YouTube
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          UPLOAD_TO_YOUTUBE: "1"
        run: python rumble_video.py

      - name: Save video for manual Rumble upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rumble-video-${{ github.run_id }}
          path: |
            final_video.mp4
            rumble_upload.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Commit upload tracker
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add upload_tracker.json || true
          git commit -m "Update upload tracker" || exit 0
          git pull --rebase || true
          git push
