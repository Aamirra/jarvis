name: Galaxy Shorts Auto Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu-core ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Galaxy Shorts Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TOKEN_JSON: ${{ secrets.TOKEN_JSON_NEW_CHANNEL }}
        CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON_NEW_CHANNEL }}
      run: |
        python galaxy_shorts_pipeline.py

    - name: Save upload tracker
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add upload_tracker.json
        git commit -m "Update upload tracker" || echo "Nothing to commit"
        git push
